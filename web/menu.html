<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pourology Menu</title>
  <meta name="description" content="Pourology Coffee Lab, Ahmedabad: pour-over and moka coffee, brewed to order.">
  <meta name="theme-color" content="#3b2414">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="menu.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pourology">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* The printed menu is always cream, so this page keeps its light palette in dark mode too. */
    body { background: var(--cream); color: var(--espresso); }
    .mp { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; }
    .mp-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .mp-head .brand { gap: 14px; }
    .mp-head .wordmark b { font-size: 2rem; }
    .mp-head .wordmark small { font-size: .7rem; color: var(--teal-deep); }
    .city { font-size: .75rem; letter-spacing: .3em; color: var(--teal-deep); }
    .tagline { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; margin: 22px 0 26px; letter-spacing: -.02em; }
    .cats { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
    .cat { border-radius: 34px; padding: 26px 24px 22px; background: var(--surface-2); color: var(--espresso); display: flex; flex-direction: column; }
    .cat.teal { background: var(--teal); } .cat.peach { background: var(--peach); }
    .cat h2 { font-size: 2rem; margin: 0; }
    .cat .sub { margin: 2px 0 14px; font-size: .92rem; }
    .item { margin: 10px 0 6px; }
    .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .item h3 { font-size: 1.35rem; margin: 0; }
    .item .price { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; white-space: nowrap; }
    .item p { margin: 4px 0 0; font-size: .92rem; line-height: 1.45; }
    .cat .foot { margin-top: auto; padding-top: 14px; font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; }
    .adds { margin-top: 18px; border: 1.5px solid var(--teal-deep); border-radius: 26px; padding: 18px 22px; }
    .adds .eyebrow { color: var(--teal-deep); }
    .adds ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 1.02rem; }
    .adds li::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 9px; background: var(--dot, var(--teal)); }
    .mp-foot { margin-top: 26px; font-size: .75rem; letter-spacing: .25em; color: var(--teal-deep); text-transform: uppercase; }
    /* Find us */
    .findus { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: #fff9ee; border: 1.5px solid var(--line); border-radius: 22px; padding: 14px 18px; margin: -6px 0 22px; }
    .findus b { font-family: var(--font-display); font-size: 1.15rem; }
    .findus .muted { font-size: .85rem; }
    /* Porter delivery */
    .deliver { margin-top: 18px; background: var(--espresso); color: var(--cream); border-radius: 30px; padding: 24px 22px; }
    .deliver h2 { font-size: 1.7rem; margin: 0 0 4px; color: var(--cream); }
    .deliver .sub { margin: 0 0 14px; color: var(--gold); font-size: .95rem; }
    .deliver ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
    .deliver li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
    .deliver li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--espresso); display: grid; place-items: center; font-weight: 700; }
    .deliver .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .deliver .note { margin: 14px 0 0; font-size: .85rem; opacity: .85; }
    .deliver label.row { display: flex; flex-wrap: nowrap; align-items: center; font-size: .85rem; color: var(--cream); gap: 8px; margin-top: 10px; }
    .deliver label.row input { width: 18px; height: 18px; flex: none; accent-color: var(--gold); }
    /* Buttons on the menu */
    .cbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; font-size: .95rem; text-decoration: none; border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; background: var(--espresso); color: var(--cream); }
    .cbtn.light { background: var(--cream); color: var(--espresso); }
    .cbtn.wa { background: #1fa855; color: #fff; }
    .cbtn.gold { background: var(--gold); color: var(--espresso); }
    .cbtn svg { width: 18px; height: 18px; flex: none; }
    /* Install */
    .install { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; border: 1.5px dashed var(--teal-deep); border-radius: 22px; padding: 16px 18px; }
    .install img { border-radius: 12px; }
    .install div { flex: 1 1 200px; }
    .install b { font-family: var(--font-display); font-size: 1.1rem; }
    .install p { margin: 2px 0 0; font-size: .88rem; color: #6b5442; }
    .ios-steps { margin: 10px 0 0; font-size: .9rem; }
    /* Sticky one-tap bar (phones) */
    .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 8px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: rgb(255 244 224 / 94%); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
    .actionbar .cbtn { flex: 1; padding: 11px 8px; font-size: .9rem; }
    body.has-bar .mp { padding-bottom: 96px; }
    @media (min-width: 760px) { .actionbar { position: static; background: none; border: 0; padding: 0; margin: 0 0 22px; backdrop-filter: none; } .actionbar .cbtn { flex: 0 1 auto; padding: 11px 20px; } body.has-bar .mp { padding-bottom: 48px; } }
    /* Top install banner */
    .install-top { display: flex; align-items: center; gap: 12px; background: var(--espresso); color: var(--cream); border-radius: 18px; padding: 10px 10px 10px 12px; margin: -8px 0 20px; }
    .install-top img { border-radius: 9px; flex: none; }
    .install-top div { flex: 1; min-width: 0; line-height: 1.25; }
    .install-top b { display: block; font-size: .95rem; }
    .install-top span { font-size: .8rem; color: var(--gold); }
    .install-top .cbtn { padding: 9px 14px; font-size: .85rem; white-space: nowrap; }
    .install-top .x { background: none; border: 0; color: var(--cream); font-size: 1.3rem; line-height: 1; padding: 4px 6px; cursor: pointer; opacity: .7; }
    .install-top .steps { flex-basis: 100%; font-size: .85rem; margin: 6px 0 2px; }
    .install-top.open { flex-wrap: wrap; }
    .offline { font-size: .8rem; color: #6b5442; margin: -14px 0 18px; }
    @media (max-width: 480px) { .mp-head .wordmark b { font-size: 1.6rem; } .cat { border-radius: 28px; padding: 22px 18px; } }
  </style>
</head>
<body>
  <main class="mp">
    <header class="mp-head">
      <span class="brand"><img src="icons/logo-tile.png" alt="" width="64" height="64"><span class="wordmark"><b>Pourology</b><small>COFFEE LAB</small></span></span>
      <span class="city">AHMEDABAD</span>
    </header>
    <h1 class="tagline">Worth the wait.</h1>
    <div id="install-top"></div>
    <nav class="actionbar" id="actionbar" aria-label="Contact Pourology" hidden></nav>
    <div id="findus"></div>
    <div id="menu"><div class="loading"><span class="spinner"></span>Loading menu…</div></div>
    <div id="delivery"></div>
    <div id="install"></div>
    <p class="mp-foot">Pay by UPI or cash at the counter</p>
  </main>
  <script type="module" src="menu.js"></script>
</body>
</html>
