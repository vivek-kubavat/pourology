<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pourology Menu</title>
  <meta name="description" content="Pourology Coffee Lab, Ahmedabad: brewed coffee, lattes, mocha, cold coffee and hot chocolate, made to order.">
  <meta name="theme-color" content="#0a3f3d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/menu-192.png">
  <link rel="manifest" href="menu.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Po Menu">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* The menu copies the printed poster (brand/pourology-menu-2026.jpg): a cream sheet with dark teal
       cards and the poster's own photos (web/img, cut by scripts/make-menu-photos.py). It keeps this light
       palette in dark mode too. */
    :root { --paper: #f8ecd8; --card: #fcf4e6; --ink: #1d1b18; --menu-teal: #1d5a56; --teal-d: #0a3f3d; --teal-ink: #12322f; --rule: #d8c7a8;
      --espresso: #2b1a10; --line: #d9c9ac; --muted: #6b5442; --font-display: "Playfair Display", Georgia, "Times New Roman", serif; color-scheme: light; }
    body { color: var(--ink); background: var(--paper); }
    .mp { max-width: 1024px; margin: 0 auto; padding-bottom: 48px; }
    .extras { padding: 0 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    /* Torn-paper header and footer bands, straight from the poster. On phones the sides are cropped so the logo stays readable. */
    .band { display: block; width: 100%; object-fit: cover; }
    .band.head { height: clamp(112px, 21.7vw, 222px); }
    .band.tail { height: clamp(56px, 9.4vw, 96px); margin-top: 6px; }
    #menu { display: grid; gap: 14px; padding: 6px 12px 0; }
    #menu > .loading, #menu > .muted, .offline { font-size: 15px; justify-content: center; text-align: center; }

    /* ---- A card per category ---- */
    .sec { position: relative; overflow: hidden; background: var(--card); border: 1.5px solid var(--menu-teal); border-radius: 20px; padding: 14px 16px; min-width: 0; }
    .sec-head { display: flex; align-items: center; gap: 12px; }
    .ico { flex: none; width: 44px; height: 44px; color: var(--menu-teal); }
    .ico svg { display: block; width: 100%; height: 100%; }
    .sec h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.1; letter-spacing: 0; margin: 0; color: var(--teal-ink); }
    .sec h2 small { font-family: var(--font-body); font-weight: 500; font-size: .58em; margin-left: .35em; white-space: nowrap; color: var(--ink); }
    .tag { margin: 3px 0 0; font-size: .9rem; line-height: 1.3; }
    .price { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }
    .drink { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; padding: 7px 0; }
    .drink + .drink { border-top: 1px solid var(--rule); }
    .drink h3 { font-family: var(--font-body); font-size: 1.04rem; font-weight: 700; margin: 0; line-height: 1.25; letter-spacing: 0; }
    .drink h3 small { font-weight: 400; font-size: .82em; white-space: nowrap; }
    .drink p { grid-column: 1; margin: 1px 0 0; font-size: .86rem; line-height: 1.3; }
    .drink .price { grid-column: 2; grid-row: 1 / span 2; font-size: 1.3rem; }
    .photo { display: block; height: auto; mix-blend-mode: multiply; } .hero .photo { mix-blend-mode: normal; }

    /* Brewed coffee: the dark teal card with the V60 photo and a cream panel of drinks */
    .sec.hero { display: grid; grid-template-columns: 1fr 34%; grid-template-areas: "head photo" "rows rows"; padding: 0; border-color: var(--teal-d); background: var(--teal-d); color: #fbf3e4; }
    .hero .sec-head { grid-area: head; padding: 16px 0 16px 16px; align-items: flex-start; }
    .hero h2, .hero h2 small, .hero .ico { color: #fbf3e4; }
    .hero .shot { grid-area: photo; position: relative; min-height: 132px; }
    .hero .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 38%); mask-image: linear-gradient(90deg, transparent, #000 38%); }
    .hero .rows { grid-area: rows; background: var(--card); color: var(--ink); border-radius: 16px; margin: 0 6px 6px; padding: 6px 14px; }
    .hero .drink + .drink { border-top: 0; }

    /* Lattes and other lists: photo on the left, drinks on the right */
    .list.pic .body { display: grid; grid-template-columns: 31% 1fr; column-gap: 12px; align-items: end; margin-top: 6px; }
    .list.pic .photo { width: calc(100% + 16px); max-width: none; margin: 0 0 -10px -16px; }
    .list:not(.pic) .rows { margin-top: 6px; }

    /* One drink: name, a line about it, a big price, photo on the right */
    .sec.single { display: grid; grid-template-columns: 1fr var(--pw, 36%); column-gap: 8px; }
    .single .txt { align-self: center; min-width: 0; }
    .single .desc { margin: 10px 0 0; font-size: 1rem; line-height: 1.3; }
    .single .price { display: block; margin-top: 8px; font-size: 2rem; line-height: 1.1; }
    .single .photo { align-self: end; width: calc(100% + 12px); max-width: none; margin: 0 -12px -12px 0; }

    /* One drink in sizes (cold coffee) */
    .sec.sizes { display: grid; grid-template-columns: 1fr auto 70px; grid-template-areas: "head head photo" "item opts opts"; gap: 10px 12px; align-items: center; }
    .sizes .sec-head { grid-area: head; } .sizes .item { grid-area: item; }
    .sizes .item h3 { font-family: var(--font-body); font-size: 1.1rem; font-weight: 700; margin: 0; letter-spacing: 0; }
    .sizes .item p { margin: 1px 0 0; font-size: .86rem; line-height: 1.3; }
    .sizes .opts { grid-area: opts; display: flex; }
    .sizes .opt { display: grid; justify-items: center; padding: 0 12px; font-size: .86rem; line-height: 1.25; }
    .sizes .opt + .opt { border-left: 1px solid var(--rule); }
    .sizes .opt b { font-size: 1rem; }
    .sizes .opt .price { font-size: 1.55rem; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--rule); align-self: stretch; text-align: center; }
    .sizes .photo { grid-area: photo; justify-self: end; width: 84px; margin: -8px -8px -10px 0; }

    /* Footer links on the sheet */
    .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; row-gap: 12px; margin: 18px 12px 0; }
    .foot .links { display: flex; align-items: stretch; }
    .foot .links a { display: grid; justify-items: center; gap: 4px; padding: 2px 16px; color: var(--teal-ink); text-decoration: none; font-size: .82rem; white-space: nowrap; border-left: 1px solid var(--rule); }
    .foot .links a:first-child { border-left: 0; }
    .foot .links a svg { width: 30px; height: 30px; }
    .foot .city { flex-basis: 100%; text-align: center; font-size: .7rem; letter-spacing: .42em; padding-left: .42em; color: var(--menu-teal); }
    .mp-foot { margin-top: 26px; font-size: .72rem; letter-spacing: .25em; color: var(--menu-teal); text-transform: uppercase; text-align: center; }

    /* ---- Wider screens: the poster's two-column layout ---- */
    @media (min-width: 700px) {
      #menu { grid-template-columns: repeat(14, 1fr); gap: 18px; padding: 8px 24px 0; }
      .sec { grid-column: span var(--span, 14); padding: 18px 22px; }
      .ico { width: 54px; height: 54px; }
      .sec h2 { font-size: 2rem; } .tag { font-size: 1rem; }
      .drink h3 { font-size: 1.18rem; } .drink p { font-size: .95rem; } .drink .price { font-size: 1.6rem; }
      .sec.hero { grid-template-columns: 1fr 31%; grid-template-areas: "head photo" "rows photo"; }
      .hero .sec-head { padding: 20px 0 16px 28px; align-items: center; gap: 18px; }
      .hero .ico { width: 64px; height: 64px; } .hero h2 { font-size: 2.4rem; }
      .hero .shot img { object-position: 50% 50%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); }
      .hero .rows { margin: 0 0 12px 12px; padding: 10px 26px 10px 30px; }
      .hero .drink { padding: 4px 0; }
      .single .desc { font-size: 1.15rem; } .single .price { font-size: 2.6rem; }
      .sec.sizes { grid-template-columns: auto 1fr auto 130px; grid-template-areas: "head item opts photo"; column-gap: 26px; }
      .sizes .item { padding-left: 26px; border-left: 1px solid var(--rule); }
      .sizes .item h3 { font-size: 1.4rem; } .sizes .item p { font-size: .95rem; }
      .sizes .opt { padding: 0 22px; font-size: .95rem; } .sizes .opt b { font-size: 1.1rem; } .sizes .opt .price { font-size: 2.1rem; }
      .sizes .photo { width: 130px; margin: -12px -8px -14px 0; }
      .foot { margin-top: 22px; }
    }
    /* Find us */
    .findus { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: #fff9ee; border: 1.5px solid var(--line); border-radius: 22px; padding: 14px 18px; margin: 26px 0 0; }
    .findus b { font-family: var(--font-display); font-size: 1.15rem; }
    .findus .muted { font-size: .85rem; }
    /* Porter delivery */
    .deliver { margin-top: 18px; background: var(--espresso); color: var(--cream); border-radius: 30px; padding: 24px 22px; }
    .deliver h2 { font-size: 1.7rem; margin: 0 0 4px; color: var(--cream); }
    .deliver .sub { margin: 0 0 14px; color: var(--gold); font-size: .95rem; }
    .deliver ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
    .deliver li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
    .deliver li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--espresso); display: grid; place-items: center; font-weight: 700; }
    .deliver .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .deliver .note { margin: 14px 0 0; font-size: .85rem; opacity: .85; }
    .deliver label.row { display: flex; flex-wrap: nowrap; align-items: center; font-size: .85rem; color: var(--cream); gap: 8px; margin-top: 10px; }
    .deliver label.row input { width: 18px; height: 18px; flex: none; accent-color: var(--gold); }
    /* Buttons on the menu */
    .cbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; font-size: .95rem; text-decoration: none; border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer; background: var(--espresso); color: var(--cream); }
    .cbtn.light { background: var(--cream); color: var(--espresso); }
    .cbtn.wa { background: #1fa855; color: #fff; }
    .cbtn.gold { background: var(--gold); color: var(--espresso); }
    .cbtn svg { width: 18px; height: 18px; flex: none; }
    /* Install */
    .install { background: #fbf5e8; margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; border: 1.5px dashed var(--teal-deep); border-radius: 22px; padding: 16px 18px; }
    .install img { border-radius: 12px; }
    .install div { flex: 1 1 200px; }
    .install b { font-family: var(--font-display); font-size: 1.1rem; }
    .install p { margin: 2px 0 0; font-size: .88rem; color: #6b5442; }
    .ios-steps { margin: 10px 0 0; font-size: .9rem; }
    /* Sticky one-tap bar (phones) */
    .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 8px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: rgb(248 236 216 / 94%); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
    .actionbar .cbtn { flex: 1; padding: 11px 8px; font-size: .9rem; }
    body.has-bar .mp { padding-bottom: 96px; }
    @media (min-width: 700px) { .actionbar { display: none; } body.has-bar .mp { padding-bottom: 56px; } }
    /* Top install banner */
    .install-top { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; background: var(--espresso); color: var(--cream); border-radius: 18px; padding: 10px 10px 10px 12px; margin: 14px 16px 0; }
    .install-top img { border-radius: 9px; flex: none; }
    .install-top div { flex: 1; min-width: 0; line-height: 1.25; }
    .install-top b { display: block; font-size: .95rem; }
    .install-top span { font-size: .8rem; color: var(--gold); }
    .install-top .cbtn { padding: 9px 14px; font-size: .85rem; white-space: nowrap; }
    .install-top .x { background: none; border: 0; color: var(--cream); font-size: 1.3rem; line-height: 1; padding: 4px 6px; cursor: pointer; opacity: .7; }
    .install-top .steps { flex-basis: 100%; font-size: .85rem; margin: 6px 0 2px; }
    .install-top.open { flex-wrap: wrap; }
    .offline { font-size: .8rem; color: #6b5442; margin: 0 0 14px; text-align: center; }
  </style>
</head>
<body>
  <main class="mp">
    <div id="install-top"></div>
    <div class="poster">
      <h1 class="sr-only">Pourology Coffee Lab menu</h1>
      <img class="band head" src="img/header.webp" width="2172" height="472" alt="Pourology Coffee Lab: Menu">
      <div id="notice"></div>
      <div id="menu"><div class="loading"><span class="spinner"></span>Loading menu…</div></div>
      <div id="foot"></div>
      <img class="band tail" src="img/footer.webp" width="2172" height="204" alt="Theory × Brew × Repeat">
    </div>
    <nav class="actionbar" id="actionbar" aria-label="Contact Pourology" hidden></nav>
    <div class="extras">
      <div id="findus"></div>
      <div id="delivery"></div>
      <div id="install"></div>
      <p class="mp-foot">Pay by UPI or cash at the counter</p>
    </div>
  </main>
  <script type="module" src="menu.js"></script>
</body>
</html>
